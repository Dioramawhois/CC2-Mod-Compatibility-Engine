name: Cross-platform dry-run core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cc2-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
        python: ["3.12", "3.13"]
    # Select macOS 15 Intel explicitly rather than the generic label's arm64 pool.
    # The required check names and full Windows/macOS Python matrix remain unchanged.
    runs-on: ${{ matrix.os == 'macos-15' && 'macos-15-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build pinned Lua 5.3 for real owned-script and syntax tests
        run: python tools/prepare_ci_lua.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - name: Restore locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check cc2_mce tests
      - name: Check formatting
        run: uv run --frozen ruff format --check cc2_mce tests
      - name: Type check
        run: uv run --frozen mypy cc2_mce
      - name: Test real Git and synthetic regression corpus
        timeout-minutes: 5
        run: uv run --frozen pytest -vv -o faulthandler_timeout=60
      - name: Installed CLI smoke
        run: uv run --frozen cc2-mce --version
      - name: Golden dry run (same expected SHA-256 on every host)
        run: uv run --frozen cc2-mce --config examples/mce.synthetic.toml build --dry-run
